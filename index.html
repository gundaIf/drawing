<script>
(function () {
  var root = document.documentElement;
  try {
    var t = localStorage.getItem("theme");
    var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", t || (prefersDark ? "dark" : "light"));
  } catch (e) { root.setAttribute("data-theme", "light"); }

  function applySeason(season, storm) {
    root.setAttribute("data-season", season);
    if (storm) root.setAttribute("data-storm", "true");
    else root.removeAttribute("data-storm");
    window.dispatchEvent(new CustomEvent("weatherchange"));
  }
  function codeToSeason(code) {
    if (code >= 95) return { season: "monsoon", storm: true };
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82))
      return { season: "monsoon", storm: false };
    return { season: "clear", storm: false };
  }
  var pin = null;
  try { pin = localStorage.getItem("season-pin"); } catch (e) {}
  if (pin) { applySeason(pin, pin === "monsoon"); return; }
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem("weather-cache") || "null"); } catch (e) {}
  if (cached && cached.season) applySeason(cached.season, cached.storm);
  else applySeason("monsoon", false);
  if (cached && (Date.now() - cached.t < 1800000)) return;
  fetch("https://api.open-meteo.com/v1/forecast?latitude=12.9716&longitude=77.5946&current=weather_code&timezone=Asia%2FKolkata")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var code = d && d.current && d.current.weather_code;
      if (typeof code !== "number") return;
      var m = codeToSeason(code);
      try { localStorage.setItem("weather-cache", JSON.stringify({ season: m.season, storm: m.storm, t: Date.now() })); } catch (e) {}
      applySeason(m.season, m.storm);
    })
    .catch(function () {});
})();
</script>

<script>
(function () {
  var root = document.documentElement;
  var clock = document.getElementById("blr-clock");
  function tick() {
    if (!clock) return;
    clock.textContent = new Date().toLocaleTimeString("en-IN", {
      hour: "2-digit", minute: "2-digit", hour12: true, timeZone: "Asia/Kolkata"
    }).toLowerCase();
  }
  tick();
  setInterval(tick, 15000);
  var word = document.getElementById("sky-word");
  function currentWord() {
    var s = root.getAttribute("data-season");
    if (s === "monsoon") return "grey";
    if (s === "clear") return "clear skies";
    return "—";
  }
  function updateWord() { if (word) word.textContent = currentWord(); }
  updateWord();
  window.addEventListener("weatherchange", updateWord);
  var sky = document.querySelector(".footer-sky");
  function setSeason(season) {
    root.setAttribute("data-season", season);
    root.removeAttribute("data-storm");
    window.dispatchEvent(new CustomEvent("weatherchange"));
  }
  function refetchLive() {
    fetch("https://api.open-meteo.com/v1/forecast?latitude=12.9716&longitude=77.5946&current=weather_code&timezone=Asia%2FKolkata")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var code = d && d.current && d.current.weather_code;
        if (typeof code !== "number") return;
        var rainy = code >= 95 || (code >= 51 && code <= 67) || (code >= 80 && code <= 82);
        var season = rainy ? "monsoon" : "clear";
        try { localStorage.setItem("weather-cache", JSON.stringify({ season: season, storm: false, t: Date.now() })); } catch (e) {}
        setSeason(season);
      })
      .catch(function () {});
  }
  if (sky) {
    sky.addEventListener("click", function () {
      var pinned = false;
      try { pinned = localStorage.getItem("season-pin") === "monsoon"; } catch (e) {}
      if (pinned) {
        try { localStorage.removeItem("season-pin"); localStorage.removeItem("weather-cache"); } catch (e) {}
        refetchLive();
      } else {
        try { localStorage.setItem("season-pin", "monsoon"); } catch (e) {}
        setSeason("monsoon");
      }
    });
  }
})();
</script>
