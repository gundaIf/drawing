<script>
(function () {
  var root = document.documentElement;
  try {
    var t = localStorage.getItem('theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', t || (prefersDark ? 'dark' : 'light'));
  } catch (e) { root.setAttribute('data-theme', 'light'); }
  function applySeason(season, storm) {
    root.setAttribute('data-season', season);
    if (storm) root.setAttribute('data-storm', 'true');
    else root.removeAttribute('data-storm');
    window.dispatchEvent(new CustomEvent('weatherchange'));
  }
  function codeToSeason(code) {
    if (code >= 95) return { season: 'monsoon', storm: true };
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82))
      return { season: 'monsoon', storm: false };
    return { season: 'clear', storm: false };
  }
  var pin = null;
  try { pin = localStorage.getItem('season-pin'); } catch (e) {}
  if (pin) { applySeason(pin, pin === 'monsoon'); return; }
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem('weather-cache') || 'null'); } catch (e) {}
  if (cached && cached.season) applySeason(cached.season, cached.storm);
  else applySeason('monsoon', false);
  if (cached && (Date.now() - cached.t < 1800000)) return;
  fetch('https://api.open-meteo.com/v1/forecast?latitude=12.9716&longitude=77.5946&current=weather_code&timezone=Asia%2FKolkata')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var code = d && d.current && d.current.weather_code;
      if (typeof code !== 'number') return;
      var m = codeToSeason(code);
      try { localStorage.setItem('weather-cache', JSON.stringify({ season: m.season, storm: m.storm, t: Date.now() })); } catch (e) {}
      applySeason(m.season, m.storm);
    })
    .catch(function () {});
})();
</script>
<link rel="stylesheet" href="https://cdn.blot.im/template/2a/39/735fd4a3cc66b29e96db1cfe403a/style.css">
<style>
.container{padding-top:0;padding-bottom:1.4em}
.board{width:min(1080px,100%);margin:0 auto 4.5em;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.8rem 2.1rem;align-items:start;position:relative;min-height:6rem}
.board[data-state=loading],.board[data-state=error]{min-height:12rem}
.board[data-state=loading]:before,.board[data-state=error]:before{content:attr(data-msg);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:rgba(var(--text-rgb),.4);pointer-events:none}
.piece{margin:0;padding:0;min-width:0}
.sheet{display:block;color:inherit;text-decoration:none}
.sheet img{display:block;width:100%;height:auto;vertical-align:middle}
.sheet:hover{color:inherit;opacity:.88}
.piece figcaption{margin:.9em .2em 0;text-align:center;font-size:13px;line-height:1.45;font-style:italic;color:rgba(var(--text-rgb),.55)}
.lb{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(3.2rem,env(safe-area-inset-top)) 3rem 5.2rem;background:#11100e;visibility:hidden;opacity:0;pointer-events:none;overflow:hidden;overscroll-behavior:none;transition:opacity .2s,visibility .2s}
.lb:target{visibility:visible;opacity:1;pointer-events:auto}
body:has(.lb:target){overflow:hidden}
.lb img{max-width:min(92vw,1200px);max-height:calc(100dvh - 8rem);width:auto;height:auto;object-fit:contain}
.lb .x,.lb .p,.lb .n{position:absolute;color:#f4efe6;background:0;border:0;font:inherit;text-decoration:none;z-index:2}
.lb .x{top:max(.7rem,env(safe-area-inset-top));right:1rem;font-size:28px;line-height:1}
.lb .p,.lb .n{top:50%;transform:translateY(-50%);font-size:32px;padding:.4em}
.lb .p{left:.15rem}.lb .n{right:.15rem}
.lb-foot{position:absolute;left:0;right:0;bottom:0;padding:.85rem 1.25rem max(.9rem,env(safe-area-inset-bottom));text-align:center;color:#f4efe6;font-size:13px;font-style:italic;background:linear-gradient(to top,#11100e 55%,transparent)}
.lb .meta a{color:inherit;text-decoration:none}
@media(max-width:800px){.board{grid-template-columns:1fr 1fr;gap:2rem 1.2rem}}
@media(max-width:520px){.board{grid-template-columns:1fr;gap:2.2rem}}
.site-header{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:1em;padding:22px 28px 0;margin:0 0 2em}
.site-header-bar,.site-nav,.site-menu-toggle,.site-nav-toggle-input{display:none !important}
.site-title{font-size:calc(15px * .6667);font-weight:400;letter-spacing:.1em;text-transform:uppercase;margin:0;line-height:1.7}
.site-header-actions{display:flex;align-items:center;gap:14px}
.home-btn{display:inline-flex;align-items:center;justify-content:center;width:1.75em;height:1.75em;padding:0;margin:0;border:0;background:none;color:inherit;cursor:pointer;line-height:1}
.home-btn svg{display:block;width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round}
.home-btn:hover{color:var(--accent,#b0673a)}
</style>
</head>
<body>
<header class="site-header">
  <h1 class="site-title"><a href="https://deeeen.xyz/">～への入り口 ✴︎ Deen David</a></h1>
  <div class="site-header-actions">
    <a class="home-btn" href="https://deeeen.xyz/" aria-label="Home, deeeen.xyz" title="Home">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.2 8.1 L8 2.8 L13.8 8.1"/><path d="M4 7.4 V13.2 H12 V7.4"/></svg>
    </a>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
      <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
    </button>
  </div>
</header>
<script>
(function() {
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function() {
    var current = document.documentElement.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });
})();
</script>
<div class="container">
<h1 id="drawings">Drawings</h1>
<p>With digital or on paper.</p>
</div>
<div class="board" id="board" data-state="loading" data-msg="pulling from are.na"></div>
<footer class="site-footer">
  <hr class="full">
  <div class="footer-row">
    <span class="footer-colophon">Made from iterations. <span class="footer-sky" title="tap to shift the mood">✴︎</span></span>
    <button class="footer-top" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ top</button>
  </div>
  <nav class="footer-links">
    <a href="https://x.com/dxeen">X</a><span class="sep">◊</span>
    <a href="https://unsplash.com/@deeeen">Unsplash</a><span class="sep">◊</span>
    <a href="https://deeeen.xyz/feed.rss">RSS</a><span class="sep">◊</span>
    <a href="mailto:deen.david@proton.me">Email</a>
  </nav>
  <div class="footer-meta">
    <span id="blr-clock">—</span> in Bangalore · it's <span id="sky-word">—</span>
  </div>
</footer>
<script>
(function () {
  var root = document.documentElement;
  var clock = document.getElementById('blr-clock');
  function tick() {
    if (!clock) return;
    clock.textContent = new Date().toLocaleTimeString('en-IN', {
      hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata'
    }).toLowerCase();
  }
  tick();
  setInterval(tick, 15000);
  var word = document.getElementById('sky-word');
  function currentWord() {
    var s = root.getAttribute('data-season');
    if (s === 'monsoon') return 'grey';
    if (s === 'clear') return 'clear skies';
    return '—';
  }
  function updateWord() { if (word) word.textContent = currentWord(); }
  updateWord();
  window.addEventListener('weatherchange', updateWord);
  var sky = document.querySelector('.footer-sky');
  function setSeason(season) {
    root.setAttribute('data-season', season);
    root.removeAttribute('data-storm');
    window.dispatchEvent(new CustomEvent('weatherchange'));
  }
  function refetchLive() {
    fetch('https://api.open-meteo.com/v1/forecast?latitude=12.9716&longitude=77.5946&current=weather_code&timezone=Asia%2FKolkata')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var code = d && d.current && d.current.weather_code;
        if (typeof code !== 'number') return;
        var rainy = code >= 95 || (code >= 51 && code <= 67) || (code >= 80 && code <= 82);
        var season = rainy ? 'monsoon' : 'clear';
        try { localStorage.setItem('weather-cache', JSON.stringify({ season: season, storm: false, t: Date.now() })); } catch (e) {}
        setSeason(season);
      })
      .catch(function () {});
  }
  if (sky) {
    sky.addEventListener('click', function () {
      var pinned = false;
      try { pinned = localStorage.getItem('season-pin') === 'monsoon'; } catch (e) {}
      if (pinned) {
        try { localStorage.removeItem('season-pin'); localStorage.removeItem('weather-cache'); } catch (e) {}
        refetchLive();
      } else {
        try { localStorage.setItem('season-pin', 'monsoon'); } catch (e) {}
        setSeason('monsoon');
      }
    });
  }
})();

(function () {
  var SLUG = "drawings-37mwydwa-8a";
  var board = document.getElementById("board");
  if (!board) return;
  var FALLBACK = [];
  var hung = [];
  function pick(img, keys) {
    if (!img) return "";
    for (var i = 0; i < keys.length; i++) {
      var node = img[keys[i]];
      var u = node && node.url;
      if (u) return String(u).split("?")[0];
    }
    return "";
  }
  function okUrl(u) {
    return /^https:\/\/(images\.are\.na|d2w9rnfcy7mm78\.cloudfront\.net)\//.test(u);
  }
  function rewire() {
    var boxes = [].slice.call(document.querySelectorAll(".lb"));
    boxes.forEach(function (box, i) {
      var prev = boxes[(i - 1 + boxes.length) % boxes.length];
      var next = boxes[(i + 1) % boxes.length];
      var p = box.querySelector(".p");
      var n = box.querySelector(".n");
      if (p && prev) p.setAttribute("href", "#" + prev.id);
      if (n && next) n.setAttribute("href", "#" + next.id);
    });
  }
  function clearBoard() {
    [].slice.call(board.querySelectorAll(".piece")).forEach(function (n) { n.remove(); });
    [].slice.call(document.querySelectorAll(".lb")).forEach(function (n) { n.remove(); });
  }
  function hang(blocks) {
    var next = blocks.filter(function (b) { return b && b.class === "Image" && b.image; }).slice();
    next.sort(function (a, b) { return new Date(b.created_at || 0) - new Date(a.created_at || 0); });
    var sig = next.map(function (b) { return b.id; }).join(",");
    if (sig && sig === hung.join(",")) {
      board.setAttribute("data-state", "ready");
      board.removeAttribute("data-msg");
      return;
    }
    clearBoard();
    hung = [];
    next.forEach(function (b) {
      var title = b.title || "Untitled";
      var thumb = pick(b.image, ["display", "square", "thumb", "large"]);
      var full = pick(b.image, ["large", "display", "original"]);
      if (!okUrl(thumb) || !okUrl(full)) return;
      hung.push(b.id);
      var fig = document.createElement("figure");
      fig.className = "piece";
      var a = document.createElement("a");
      a.className = "sheet"; a.href = "#w" + b.id; a.setAttribute("aria-label", title);
      var img = document.createElement("img");
      img.src = thumb; img.alt = title; img.loading = "lazy";
      a.appendChild(img); fig.appendChild(a);
      var cap = document.createElement("figcaption"); cap.textContent = title; fig.appendChild(cap);
      board.appendChild(fig);
      var aside = document.createElement("aside"); aside.className = "lb"; aside.id = "w" + b.id;
      var x = document.createElement("a"); x.className = "x"; x.href = "#"; x.setAttribute("aria-label", "Close"); x.textContent = "\u00d7"; aside.appendChild(x);
      var prev = document.createElement("a"); prev.className = "p"; prev.href = "#"; prev.setAttribute("aria-label", "Previous"); prev.textContent = "\u2039"; aside.appendChild(prev);
      var big = document.createElement("img"); big.src = full; big.alt = title; aside.appendChild(big);
      var nxt = document.createElement("a"); nxt.className = "n"; nxt.href = "#"; nxt.setAttribute("aria-label", "Next"); nxt.textContent = "\u203a"; aside.appendChild(nxt);
      var foot = document.createElement("div"); foot.className = "lb-foot";
      var meta = document.createElement("span"); meta.className = "meta";
      meta.appendChild(document.createTextNode(title + " \u00b7 "));
      var link = document.createElement("a"); link.href = "https://www.are.na/block/" + b.id; link.textContent = "on are.na";
      meta.appendChild(link); foot.appendChild(meta); aside.appendChild(foot);
      document.body.appendChild(aside);
    });
    rewire();
    board.setAttribute("data-state", hung.length ? "ready" : "error");
    if (!hung.length) board.setAttribute("data-msg", "no drawings yet");
    else board.removeAttribute("data-msg");
  }
  function page(p, acc) {
    return fetch("https://api.are.na/v2/channels/" + SLUG + "/contents?per=100&page=" + p)
      .then(function (r) {
        if (!r.ok) throw new Error("arena " + r.status);
        return r.json();
      })
      .then(function (d) {
        var list = Array.isArray(d) ? d : (d.contents || []);
        acc = acc.concat(list);
        if (list.length === 100) return page(p + 1, acc);
        return acc;
      });
  }
  function cacheGet() {
    try {
      var x = JSON.parse(localStorage.getItem("drawings-arena") || "null");
      if (x && Array.isArray(x.blocks) && x.blocks.length) return x.blocks;
    } catch (e) {}
    return FALLBACK;
  }
  function cacheSet(blocks) {
    try { localStorage.setItem("drawings-arena", JSON.stringify({ t: Date.now(), blocks: blocks })); } catch (e) {}
  }
  hang(cacheGet());
  page(1, [])
    .then(function (list) {
      var blocks = list.filter(function (b) { return b && b.class === "Image" && b.image; });
      if (blocks.length) cacheSet(blocks);
      hang(blocks.length ? blocks : cacheGet());
    })
    .catch(function () {
      if (!hung.length) hang(cacheGet());
      if (!hung.length) {
        board.setAttribute("data-state", "error");
        board.setAttribute("data-msg", "couldn\u2019t reach are.na");
      }
    });
})();
document.addEventListener("keydown", function (e) {
  if (location.hash.charAt(1) !== "w") return;
  var box = document.querySelector(location.hash);
  if (!box) return;
  if (e.key === "Escape") location.hash = "";
  if (e.key === "ArrowRight") { var n = box.querySelector(".n"); if (n) location.hash = n.getAttribute("href"); }
  if (e.key === "ArrowLeft") { var p = box.querySelector(".p"); if (p) location.hash = p.getAttribute("href"); }
});
</script>
</body>
</html>
